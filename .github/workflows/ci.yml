name: CI

on:
  push:
    # Solo main: con todas las ramas, un PR del propio repo ejecutaba la
    # CI dos veces (una por el push de la rama y otra por pull_request).
    branches: [main]
  pull_request:

# Un solo run por combinación de workflow y ref: un push detrás de otro
# cancela el anterior en vez de apilar runs que solo consumen runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# El checkout es todo lo que hace falta: el resto de la API, fuera.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + tests (stable, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows y macOS solo se compilaban en el tag, cuando ya no se
        # puede corregir nada: la matriz de PR es donde deben saltar (M20).
        os: [ubuntu-24.04, ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # tp-app usa rfd (diálogos nativos) con backend GTK3 en Linux: necesita
      # las dev-libs para enlazar glib/gtk en el build script de *-sys. En
      # Windows y macOS no hay GTK: los diálogos vienen de serie.
      - name: Instalar dependencias de sistema (GTK3 dev)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev

      - name: Instalar Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de cargo
        uses: Swatinem/rust-cache@v2

      - name: Formato (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lints (cargo clippy -D warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests del workspace
        run: cargo test --workspace --locked

  msrv:
    name: MSRV 1.93.0 (cargo check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependencias de sistema (GTK3 dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev

      - name: Instalar Rust 1.93.0 (versión mínima soportada)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Caché de cargo (MSRV)
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # Solo compilar: los tests ya corren en la matriz de stable sobre
      # los mismos código. Aquí lo único que se garantiza es que el
      # workspace entre y enlace con la versión mínima soportada.
      - name: cargo check --workspace --locked
        run: cargo check --workspace --all-targets --locked

  gpu-formats:
    name: build con ASTC (gpu-formats)
    runs-on: ubuntu-24.04
    # El encoder ASTC compila C++ de ARM astcenc (el runner trae toolchain
    # C/C++ de serie).
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de cargo (gpu-formats)
        uses: Swatinem/rust-cache@v2
        with:
          key: gpu-formats

      - name: cargo check --features gpu-formats
        run: cargo check --locked -p tp-core --features gpu-formats
