name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt + clippy + tests (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tp-app usa rfd (diálogos nativos) con backend GTK3: necesita las
      # dev-libs para enlazar glib/gtk en el build script de *-sys.
      - name: Instalar dependencias de sistema (GTK3 dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev

      - name: Instalar Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de cargo
        uses: Swatinem/rust-cache@v2

      - name: Formato (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lints (cargo clippy -D warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests del workspace
        run: cargo test --workspace --locked

  msrv:
    name: MSRV 1.93.0 (cargo check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema (GTK3 dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev

      - name: Instalar Rust 1.93.0 (versión mínima soportada)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Caché de cargo (MSRV)
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check --workspace --locked
        run: cargo check --workspace --all-targets --locked

      - name: Tests del workspace
        run: cargo test --workspace --locked

  gpu-formats:
    name: build con ASTC (gpu-formats)
    runs-on: ubuntu-latest
    # El encoder ASTC compila C++ de ARM astcenc (el runner trae toolchain
    # C/C++ de serie).
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de cargo (gpu-formats)
        uses: Swatinem/rust-cache@v2
        with:
          key: gpu-formats

      - name: cargo check --features gpu-formats
        run: cargo check --locked -p tp-core --features gpu-formats
