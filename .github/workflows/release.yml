name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # tp-app usa rfd con backend GTK3: en Linux necesita las dev-libs para
      # enlazar glib/gtk en el build script de *-sys.
      - name: Instalar dependencias de sistema (GTK3 dev, Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev

      - name: Instalar enlazador cruzado y GTK3 cross (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Caché de cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Binario CLI sin dependencias de sistema y con estrellas para reducir
      # el tamaño (lto thin del workspace + strip por binario).
      - name: Compilar tp-cli (${{ matrix.target }})
        run: cargo build --release --locked -p tp-cli --target ${{ matrix.target }}

      # La app solo se compila donde tiene soporte nativo de GTK3 / rfd
      # (Linux x64 nativo con GTK3, Windows y macOS).
      - name: Compilar tp-app (${{ matrix.target }})
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' || matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        run: cargo build --release --locked -p tp-app --target ${{ matrix.target }}

      - name: Preparar artefactos (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tp-cli dist/
          tar -czf tp-cli-${{ matrix.target }}.tar.gz -C dist tp-cli
          if [ -f target/${{ matrix.target }}/release/tp-app ]; then
            # Zip con LEEME de GTK3: la app se enlaza a libgtk-3 del sistema.
            cp target/${{ matrix.target }}/release/tp-app dist/
            mkdir -p tp-app-linux
            cp dist/tp-app packaging/linux/LEEME-GTK3.txt tp-app-linux/
            zip -j tp-app-${{ matrix.target }}.zip tp-app-linux/*
            tar -czf tp-app-${{ matrix.target }}.tar.gz -C dist tp-app
          fi

      - name: Preparar artefactos (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/tp-cli.exe dist/
          Compress-Archive -Path dist/tp-cli.exe -DestinationPath tp-cli-${{ matrix.target }}.zip
          Copy-Item target/${{ matrix.target }}/release/tp-app.exe dist/

          # ---- Instalador .msi (WiX v3 vía dotnet tool) ----
          dotnet tool install --global wix
          wix extension add -g WixToolset.UI.wixext

          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'tp-app' } | Select-Object -ExpandProperty version

          $wxs = Get-Content packaging/windows/texturepacker-rs.wxs -Raw
          $wxs = $wxs.Replace('@VERSION@', $version)
          $wxs = $wxs.Replace('@EXE_APP@', "$PWD/target/${{ matrix.target }}/release/tp-app.exe")
          $wxs = $wxs.Replace('@EXE_CLI@', "$PWD/target/${{ matrix.target }}/release/tp-cli.exe")
          # Icono y licencia son opcionales: sin ellos, se recortan del manifiesto.
          if (-not (Test-Path 'packaging/windows/icon.ico')) {
            $wxs = $wxs -replace '<Property Id="ARPPRODUCTICON"[^>]*/>', ''
            $wxs = $wxs -replace '<Icon [^>]*/>', ''
            $wxs = $wxs -replace '\s*Icon="AppIcon"', ''
          }
          if (-not (Test-Path 'packaging/windows/licencia.rtf')) {
            $wxs = $wxs -replace '<WixVariable [^>]*/>', ''
          }
          Set-Content -Path "$env:RUNNER_TEMP/texturepacker-rs.wxs" -Value $wxs

          $uiExt = (wix extension list -g | Select-String 'WixToolset.UI.wixext').ToString()
          wix build "$env:RUNNER_TEMP/texturepacker-rs.wxs" `
            -ext "$($uiExt -replace '.*\s', '')" `
            -o "texturepacker-rs-${{ matrix.target }}.msi"

          Compress-Archive -Path dist/tp-app.exe -DestinationPath tp-app-${{ matrix.target }}.zip

      - name: Preparar artefactos (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tp-cli dist/
          tar -czf tp-cli-${{ matrix.target }}.tar.gz -C dist tp-cli

          # ---- Bundle .app + .dmg con firma ad-hoc ----
          # Sin firma, los binarios arm64 no arrancan en Gatekeeper.
          APP="TexturePacker-RS.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/${{ matrix.target }}/release/tp-app "$APP/Contents/MacOS/"
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='tp-app'))")
          sed -e "s/@VERSION@/$VERSION/" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"

          # El dmg se crea desde una carpeta temporal con el bundle.
          DMG_DIR=$(mktemp -d)
          cp -R "$APP" "$DMG_DIR/"
          hdiutil create -volname "TexturePacker-RS" \
            -srcfolder "$DMG_DIR" -ov -format UDZO \
            "tp-app-${{ matrix.target }}.dmg"
          rm -rf "$APP" "$DMG_DIR"

          tar -czf tp-app-${{ matrix.target }}.tar.gz -C dist tp-app

      - name: Subir artefactos del job
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            tp-cli-*.tar.gz
            tp-cli-*.zip
            tp-app-*.tar.gz
            tp-app-*.zip
            tp-app-*.dmg
            *.msi
          if-no-files-found: error

  release:
    name: publicar release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar release con los binarios
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tp-cli-*.tar.gz
            dist/tp-cli-*.zip
            dist/tp-app-*.tar.gz
            dist/tp-app-*.zip
            dist/tp-app-*.dmg
            dist/*.msi
          body: |
            Primera versión pública de TexturePacker-RS 🧩

            - **tp-cli**: empaquetado headless y descifrado (`tp-cli pack`, `tp-cli decrypt`)
            - **tp-app**: aplicación de escritorio (egui/eframe)

            | Plataforma | Binarios |
            |---|---|
            | Linux x64 | `tp-cli-x86_64-unknown-linux-gnu.tar.gz`, `tp-app-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux arm64 (solo CLI) | `tp-cli-aarch64-unknown-linux-gnu.tar.gz` |
            | Windows x64 | `tp-cli-x86_64-pc-windows-msvc.zip`, `tp-app-x86_64-pc-windows-msvc.zip` |
            | macOS Apple Silicon | `tp-cli-aarch64-apple-darwin.tar.gz`, `tp-app-aarch64-apple-darwin.tar.gz` |
            | macOS Intel | `tp-cli-x86_64-apple-darwin.tar.gz`, `tp-app-x86_64-apple-darwin.tar.gz` |

            La app de escritorio en Linux requiere las librerías GTK3 del sistema
            (`libgtk-3`); los binarios no las empaquetan.
          generate_release_notes: true
