name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            friendly: linux-x64
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            friendly: linux-arm64
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            friendly: windows-x64
            os: windows-latest
          - target: aarch64-apple-darwin
            friendly: macos-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            friendly: macos-intel
            os: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Instalar toolchain Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      # tp-app usa rfd con backend GTK3: en Linux necesita las dev-libs para
      # enlazar glib/gtk en el build script de *-sys.
      - name: Instalar dependencias de sistema (GTK3 dev, Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev

      - name: Instalar enlazador cruzado y GTK3 cross (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Caché de cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Mismos gates que el CI: una release no puede salir de un árbol que
      # no pasa fmt/clippy/tests.
      - name: Formato (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lints (cargo clippy -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests del workspace
        run: cargo test --workspace --locked

      # Binario CLI sin dependencias de sistema y con estrellas para reducir
      # el tamaño (lto thin del workspace + strip por binario).
      - name: Compilar tp-cli (${{ matrix.target }})
        run: cargo build --release --locked -p tp-cli --target ${{ matrix.target }}

      # La app solo se compila donde tiene soporte nativo de GTK3 / rfd
      # (Linux x64 nativo con GTK3, Windows y macOS).
      - name: Compilar tp-app (${{ matrix.target }})
        if: matrix.os == 'ubuntu-24.04' && matrix.target == 'x86_64-unknown-linux-gnu' || matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        run: cargo build --release --locked -p tp-app --target ${{ matrix.target }}

      - name: Preparar artefactos (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tp-cli dist/
          tar -czf tp-cli-${{ matrix.friendly }}.tar.gz -C dist tp-cli
          if [ -f target/${{ matrix.target }}/release/tp-app ]; then
            # Zip con LEEME de GTK3, icono y lanzador .desktop.
            cp target/${{ matrix.target }}/release/tp-app dist/
            mkdir -p tp-app-linux
            cp dist/tp-app packaging/linux/LEEME-GTK3.txt tp-app-linux/
            cp packaging/icon.png tp-app-linux/icon.png
            # El .desktop lleva @INSTALL_DIR@ sin sustituir: el zip es
            # portable y el LEEME explica cómo completarlo tras descomprimir.
            cp packaging/linux/tp-app.desktop tp-app-linux/
            zip -j tp-app-${{ matrix.friendly }}.zip tp-app-linux/*
            tar -czf tp-app-${{ matrix.friendly }}.tar.gz -C dist tp-app
          fi

      - name: Preparar artefactos (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/tp-cli.exe dist/
          Compress-Archive -Path dist/tp-cli.exe -DestinationPath tp-cli-${{ matrix.friendly }}.zip
          Copy-Item target/${{ matrix.target }}/release/tp-app.exe dist/

          # ---- Instalador .msi (WiX v3 clásico candle/light; el tool v7
          # de dotnet exige aceptar la EULA OSMF, así que usamos choco) ----
          choco install wixtoolset -y --no-progress
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"

          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'tp-app' } | Select-Object -ExpandProperty version

          $wxs = Get-Content packaging/windows/texturepacker-rs.wxs -Raw
          $wxs = $wxs.Replace('@VERSION@', $version)
          $wxs = $wxs.Replace('@EXE_APP@', "$PWD\target\${{ matrix.target }}\release\tp-app.exe")
          $wxs = $wxs.Replace('@EXE_CLI@', "$PWD\target\${{ matrix.target }}\release\tp-cli.exe")
          # Sin icon.ico ni licencia.rtf en el repo: se recortan del manifiesto
          # (instalador con UI básica y sin página de licencia).
          $wxs = $wxs -replace '<Property Id="ARPPRODUCTICON"[^>]*/>', ''
          $wxs = $wxs -replace '<Icon [^>]*/>', ''
          $wxs = $wxs -replace '\s*Icon="AppIcon"', ''
          $wxs = $wxs -replace '<WixVariable [^>]*/>', ''
          Set-Content -Path "$env:RUNNER_TEMP\texturepacker-rs.wxs" -Value $wxs -Encoding UTF8

          & "$wixBin\candle.exe" -arch x64 -out "$env:RUNNER_TEMP\tp.wixobj" "$env:RUNNER_TEMP\texturepacker-rs.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wixBin\light.exe" -out "texturepacker-rs-${{ matrix.friendly }}.msi" "$env:RUNNER_TEMP\tp.wixobj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Compress-Archive -Path dist/tp-app.exe -DestinationPath tp-app-${{ matrix.friendly }}.zip

      - name: Preparar artefactos (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/tp-cli dist/
          tar -czf tp-cli-${{ matrix.friendly }}.tar.gz -C dist tp-cli

          # ---- Bundle .app + .dmg con firma ad-hoc ----
          # Sin firma, los binarios arm64 no arrancan en Gatekeeper.
          APP="TexturePacker-RS.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/tp-app "$APP/Contents/MacOS/"
          # Icono: iconutil genera el .icns desde el iconset del repo.
          iconutil -c icns packaging/macos/icon.iconset \
            -o "$APP/Contents/Resources/icon.icns"
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='tp-app'))")
          sed -e "s/@VERSION@/$VERSION/" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"

          # El dmg se crea desde una carpeta temporal con el bundle.
          DMG_DIR=$(mktemp -d)
          cp -R "$APP" "$DMG_DIR/"
          hdiutil create -volname "TexturePacker-RS" \
            -srcfolder "$DMG_DIR" -ov -format UDZO \
            "tp-app-${{ matrix.friendly }}.dmg"
          rm -rf "$APP" "$DMG_DIR"

          cp target/${{ matrix.target }}/release/tp-app dist/
          tar -czf tp-app-${{ matrix.friendly }}.tar.gz -C dist tp-app

      - name: Subir artefactos del job
        uses: actions/upload-artifact@v6
        with:
          name: bin-${{ matrix.target }}
          path: |
            tp-cli-*.tar.gz
            tp-cli-*.zip
            tp-app-*.tar.gz
            tp-app-*.zip
            tp-app-*.dmg
            *.msi
          if-no-files-found: error

  release:
    name: publicar release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publicar release con los binarios
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/tp-cli-*.tar.gz
            dist/tp-cli-*.zip
            dist/tp-app-*.tar.gz
            dist/tp-app-*.zip
            dist/tp-app-*.dmg
            dist/*.msi
          body: |
            ## Novedades

            - **Vista de trabajo dinámica**: la vista previa se recalcula en memoria
              al editar; «Publicar» escribe los ficheros cuando tú decides.
            - **Autowatch**: editar, crear o borrar PNGs refresca la vista al momento.
            - **Algoritmo Manual**: arrastra sprites en la vista para fijar su posición.
            - **Pack por carpetas**: hojas como en TexturePacker (arrastre entre hojas
              en el panel) y modo automático que espeja tus subcarpetas de entrada.
            - **Icono propio** en la ventana, el instalador Windows (.msi), el bundle
              macOS (.app) y el lanzador de Linux.
            - **Instaladores nativos**: `.dmg` firmado (ad-hoc) en macOS, `.msi` con
              WiX en Windows y zip con lanzador `.desktop` en Linux.

            ## Descargas

            | Plataforma | tp-app | tp-cli |
            |---|---|---|
            | Linux x64 | `tp-app-linux-x64.tar.gz` · zip con `.desktop` | `tp-cli-linux-x64.tar.gz` |
            | Linux arm64 | — | `tp-cli-linux-arm64.tar.gz` |
            | Windows x64 | `tp-app-windows-x64.zip` o **instalador `.msi`** | `tp-cli-windows-x64.zip` |
            | macOS Apple Silicon | `tp-app-macos-arm64.dmg` o `.tar.gz` | `tp-cli-macos-arm64.tar.gz` |
            | macOS Intel | `tp-app-macos-intel.dmg` o `.tar.gz` | `tp-cli-macos-intel.tar.gz` |

            La app en Linux requiere GTK3 del sistema; el zip incluye un LEEME
            con la orden de instalación para cada distro.
          generate_release_notes: true
