[package]
name = "tp-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TexturePacker-RS desktop application (egui/eframe)"
# `cargo run -p tp-app` arranca la app y no el autotest `tp-smoke`
# (el que pide `--bin` en el propio README).
default-run = "tp-app"

[dependencies]
tp-i18n = { path = "../tp-i18n" }
tp-core = { path = "../tp-core", features = ["gpu-formats"] }
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
notify = "8"
# Decodificar el icono de ventana embebido (packaging/icon.png).
image.workspace = true

[lints]
workspace = true
