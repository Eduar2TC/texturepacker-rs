[package]
name = "tp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TexturePacker-RS engine core: ingest, polygon engine, packing, pixel ops, export"

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
rayon.workspace = true
image.workspace = true
xxhash-rust.workspace = true
aes-gcm.workspace = true
rand.workspace = true
handlebars.workspace = true
sha2 = "0.10"
# KDF del cifrado de exportación (TPENC2): Argon2id, que es lo que la
# recomendación de OWASP pide cuando se puede usar. Antes la clave era
# un SHA-256 pelón del passphrase, sin sal ni coste, y un diccionario
# por GPU la revolvía en minutos.
argon2 = "0.5"
png = "0.18"
webp = { version = "0.3", default-features = false }
astcenc-rs = { workspace = true, optional = true }
# Compresor Basis Universal (ETC1S) para `.basis`; envuelve el FFI de Binomial
# (el único `unsafe` del workspace, aislado en su propio crate).
tp-basis = { path = "../tp-basis", optional = true }
flate2.workspace = true
# `--replace`: sustituciones por expresión regular en los ids de sprite.
regex.workspace = true
# Decodificación de bloques GPU al leer .ktx / .astc de entrada (MIT/Apache).
texture2ddecoder = "0.1.2"
# Entrada .psd (Adobe Photoshop, Apache-2.0) y .svg (render con resvg, que
# reexporta usvg/tiny-skia; Apache-2.0 OR MIT).
# Proyectos `.tps` del original: XML de QSettings de Qt.
roxmltree.workspace = true
psd = "0.3"
resvg = "0.48"

[features]
default = []
# GPU texture encoders (ASTC via ARM's astcenc, ETC2 built-in, Basis Universal
# via tp-basis). Requires a C/C++ toolchain.
gpu-formats = ["dep:astcenc-rs", "dep:tp-basis"]

[lints]
workspace = true
