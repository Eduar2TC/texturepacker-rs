[workspace]
resolver = "2"
members = ["crates/tp-core", "crates/tp-app", "crates/tp-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/Eduar2TC/texturepacker-rs"
description = "TexturePacker-RS: a parallel texture atlas packer engine and desktop app written in Rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = [
    "png", "webp", "jpeg", "tga", "bmp", "gif", "ico", "tiff", "dds", "qoi",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
aes-gcm = "0.10"
rand = "0.9"
handlebars = "6"
eframe = "0.33"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
astcenc-rs = { version = "0.2" }

[profile.release]
lto = "thin"
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
# El allow de chunks_exact_to_as_chunks (ver abajo) no existe en clippy < 1.98
# y generaría unknown_lints; silenciado explícitamente para mantener
# `-D warnings` estable entre toolchains.
unknown_lints = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Lint de estilo introducido en clippy 1.98: sugiere `as_chunks::<N>()` en los
# ~29 `chunks_exact(4)` del motor. Se permite para que `-D warnings` sea
# estable entre versiones de toolchain (local 1.93 vs CI stable).
chunks_exact_to_as_chunks = { level = "allow", priority = 1 }
