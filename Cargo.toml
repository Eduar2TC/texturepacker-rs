[workspace]
resolver = "2"
members = ["crates/tp-core", "crates/tp-app", "crates/tp-cli", "crates/tp-basis"]
# winit parcheado fuera del workspace (ver [patch.crates-io] abajo).
exclude = ["third_party/winit"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/Eduar2TC/texturepacker-rs"
description = "TexturePacker-RS: a parallel texture atlas packer engine and desktop app written in Rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = [
    "png", "webp", "jpeg", "tga", "bmp", "gif", "ico", "tiff", "dds", "qoi",
    "pnm",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
aes-gcm = "0.10"
rand = "0.9"
handlebars = "6"
eframe = "0.33"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
astcenc-rs = { version = "0.2" }
# Compresión de contenedores (zktx, pvr3gz, pvr3ccz); backend puro en Rust.
flate2 = "1"
# Expresiones regulares para `--replace` (sustituciones en los nombres de
# sprite). Ya entraba vía bindgen (build), así que no es una dependencia nueva
# del árbol.
regex = "1"
# Lectura de proyectos `.tps` del original (XML de QSettings de Qt).
# Ya entraba vía resvg/usvg, así que sólo se fija la versión.
roxmltree = "0.21"

[profile.release]
lto = "thin"
opt-level = 3
# Quita las tablas de símbolos de los binarios publicados. En release no hay
# debuginfo, pero la simbología pesa: medido en tp-cli, 16,2 → 13,3 MB (-18 %).
# En MSVC la información de depuración vive en el .pdb aparte, que no se
# distribuye, así que ahí no cambia nada.
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
# El allow de chunks_exact_to_as_chunks (ver abajo) no existe en clippy < 1.98
# y generaría unknown_lints; silenciado explícitamente para mantener
# `-D warnings` estable entre toolchains.
unknown_lints = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Lint de estilo introducido en clippy 1.98: sugiere `as_chunks::<N>()` en los
# ~29 `chunks_exact(4)` del motor. Se permite para que `-D warnings` sea
# estable entre versiones de toolchain (local 1.93 vs CI stable).
chunks_exact_to_as_chunks = { level = "allow", priority = 1 }

# winit 0.30.13 con drag-and-drop nativo en Wayland.
#
# winit 0.30 solo emite `HoveredFile`/`DroppedFile` vía XDND (X11); en Wayland
# no hay API, así que eframe/egui nunca recibe `hovered_files`/`dropped_files`
# y el soltar ficheros del gestor de archivos no funciona (el overlay azul de
# `handle_global_file_drop` solo aparece bajo X11/XWayland).
#
# `third_party/winit` es winit 0.30.13 con aplicado el commit 988f0b8 de
# github.com/IndigoCarmine/winit (rama `wayland-native-dnd`): 4 archivos,
# +370 líneas, puramente aditivos sobre el backend Wayland (wl_data_device →
# eventos clásicos de winit; no toca la API pública ni X11/Win32/macOS).
#
# Para eliminarlo: borrar `third_party/winit`, este bloque y `workspace.exclude`
# cuando eframe publique sobre winit 0.31 (rust-lang/winit#4571, con DnD en
# Wayland, ya está fusionada en master).
[patch.crates-io]
winit = { path = "third_party/winit" }
