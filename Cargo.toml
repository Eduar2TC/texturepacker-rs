[workspace]
resolver = "2"
members = ["crates/tp-core", "crates/tp-app", "crates/tp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/texturepacker-rs"
description = "TexturePacker-RS: a parallel texture atlas packer engine and desktop app written in Rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = [
    "png", "webp", "jpeg", "tga", "bmp", "gif", "ico", "tiff", "dds", "qoi",
] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
aes-gcm = "0.10"
rand = "0.9"
handlebars = "6"
eframe = "0.33"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
astcenc-rs = { version = "0.2" }

[profile.release]
lto = "thin"
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
